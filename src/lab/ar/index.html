<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AR test · The Snug Collection</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fff;color:#2a2624;padding:24px 16px 48px;max-width:560px;margin-inline:auto}
h1{font-size:22px;margin:0 0 6px}p{margin:0 0 18px;line-height:1.45;color:#5c524d}
.look{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:14px;border:1px solid #e6dfda;border-radius:18px;margin-bottom:12px}
.look img{width:96px;height:96px;object-fit:contain;border-radius:12px;background:#f7f4f1}
.look b{display:block;font-size:17px;margin-bottom:4px}.look small{color:#5c524d}
a.ar{display:inline-block;margin-top:8px;padding:9px 14px;border-radius:999px;background:#2a2624;color:#fff;text-decoration:none;font-weight:600;font-size:14px}
.note{font-size:13px;color:#5c524d;margin-top:22px}
</style>
</head>
<body>
<h1>View a cover in your space</h1>
<p>Internal test. Tap a button to place the cover and base on your counter at true size. iPhone opens AR Quick Look; Android opens Scene Viewer.</p>
<div id="looks"></div>
<p class="note">Shows our cover, sweater and base only. The device is not drawn. Models are scaled to Apple's published 14.55 cm display width.</p>
<script>
var looks=[['blush','Blush Puff'],['holly','Holly Bow'],['oat','Oat Puff']];
var ua=navigator.userAgent, ios=/iPhone|iPad|iPod/.test(ua), android=/Android/.test(ua), base=location.origin+'/lab/ar/';
document.getElementById('looks').innerHTML=looks.map(function(l){
  var k=l[0], usdz=base+k+'.usdz', glb=base+k+'.glb';
  var href=ios?usdz:'intent://arvr.google.com/scene-viewer/1.0?file='+encodeURIComponent(glb)+'&mode=ar_preferred&title='+encodeURIComponent(l[1])+'#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url='+encodeURIComponent(location.href)+';end;';
  var rel=ios?' rel="ar"':'';
  return '<div class="look"><a'+rel+' href="'+href+'"><img src="/lab/ar/'+k+'.webp" alt=""></a><div><b>'+l[1]+'</b><small>'+(ios?'AR Quick Look':android?'Scene Viewer':'Open on a phone to view in AR')+' · '+(k==='holly'?'1.9':k==='blush'?'1.6':'1.0')+' MB</small><br><a class="ar"'+rel+' href="'+href+'">View in your space</a></div></div>';
}).join('');
</script>
</body>
</html>
